# GitHub Actions: build + tests on every push.
# The OAuth token used for automated pushes has no `workflow` scope, so this file
# lives here on purpose. Copy it to .github/workflows/ci.yml in the GitHub web
# editor (or push it with a token that has the workflow scope) to switch CI on.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build mini app and worker bundle
        run: npm run build
      - name: Tests
        run: npm test
      - name: Check the worker bundle is syntactically valid
        run: node --check worker/index.js
